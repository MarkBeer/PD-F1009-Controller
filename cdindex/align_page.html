<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Line up the cases</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      background: #16130f;
      color: #f3ecdf;
      font: 16px/1.45 "Segoe UI", sans-serif;
    }
    aside {
      width: 300px;
      flex: none;
      padding: 20px 18px 28px;
      background: #221c16;
      border-right: 1px solid #3a3126;
    }
    h1 { font-size: 22px; margin: 0 0 8px; font-weight: 650; }
    p { margin: 0 0 14px; color: #d9cbb6; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: #b5a48d; }
    input[type="number"] {
      width: 100%;
      font: inherit;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #5a4c3a;
      background: #120f0c;
      color: inherit;
    }
    input[type="range"] { width: 100%; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button {
      font: inherit;
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 0;
      cursor: pointer;
    }
    button.save { background: #e7f27a; color: #1b160f; font-weight: 650; }
    button.ghost { background: transparent; color: #f3ecdf; border: 1px solid #5a4c3a; }
    #status { min-height: 3em; margin-top: 12px; }
    main { flex: 1; overflow: auto; padding: 12px; }
    canvas { display: block; background: #000; cursor: grab; touch-action: none; }
    canvas.dragging { cursor: grabbing; }
    @media (max-width: 800px) {
      body { flex-direction: column; }
      aside { width: auto; border-right: 0; border-bottom: 1px solid #3a3126; }
    }
  </style>
</head>
<body>
  <aside>
    <h1>Line up the cases</h1>
    <p>Drag a corner to resize. The other three stay where they are, so the top left can stay put while the bottom right moves. Near cases look bigger than far ones; the lines follow that.</p>
    <div class="row">
      <div>
        <label for="rows">Rows</label>
        <input id="rows" type="number" min="1" max="20" value="8">
      </div>
      <div>
        <label for="cols">Columns</label>
        <input id="cols" type="number" min="1" max="20" value="6">
      </div>
    </div>
    <label for="inset">Inset <span id="inset-value">6</span> px</label>
    <input id="inset" type="range" min="0" max="30" value="6">
    <label for="zoom">Zoom <span id="zoom-value">Fit</span></label>
    <input id="zoom" type="range" min="50" max="400" value="100">
    <button class="ghost" id="focus-br" type="button">Zoom to bottom-right</button>
    <button class="save" id="save" type="button">Save crops</button>
    <button class="ghost" id="reset" type="button">Start from a fresh box</button>
    <p id="status">The bottom-right corner is selected. Drag it, or use the arrow keys, to resize.</p>
  </aside>
  <main>
    <canvas id="stage"></canvas>
  </main>
  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const rowsInput = document.getElementById("rows");
    const colsInput = document.getElementById("cols");
    const insetInput = document.getElementById("inset");
    const insetValue = document.getElementById("inset-value");
    const status = document.getElementById("status");
    const photo = new Image();
    const main = document.querySelector("main");
    const zoomInput = document.getElementById("zoom");
    const zoomValue = document.getElementById("zoom-value");
    let corners = [[0, 0], [1, 0], [1, 1], [0, 1]];
    let drag = null;
    let selected = { kind: "corner", index: 2 };
    let homography = null;
    const cornerNames = ["top-left", "top-right", "bottom-right", "bottom-left"];
    const edgeNames = ["top", "right", "bottom", "left"];

    function solve(matrix, values) {
      const size = values.length;
      const rows = matrix.map((row, index) => row.concat(values[index]));
      for (let col = 0; col < size; col++) {
        let pivot = col;
        for (let row = col + 1; row < size; row++) {
          if (Math.abs(rows[row][col]) > Math.abs(rows[pivot][col])) pivot = row;
        }
        [rows[col], rows[pivot]] = [rows[pivot], rows[col]];
        const scale = rows[col][col];
        if (Math.abs(scale) < 1e-10) return null;
        for (let k = col; k <= size; k++) rows[col][k] /= scale;
        for (let row = 0; row < size; row++) {
          if (row === col) continue;
          const factor = rows[row][col];
          for (let k = col; k <= size; k++) rows[row][k] -= factor * rows[col][k];
        }
      }
      return rows.map((row) => row[size]);
    }

    function perspective(u, v) {
      if (!homography) {
        const src = [[0, 0], [1, 0], [1, 1], [0, 1]];
        const system = [];
        const values = [];
        src.forEach(([x, y], index) => {
          const [X, Y] = corners[index];
          system.push([x, y, 1, 0, 0, 0, -X * x, -X * y]);
          values.push(X);
          system.push([0, 0, 0, x, y, 1, -Y * x, -Y * y]);
          values.push(Y);
        });
        homography = solve(system, values);
      }
      const h = homography;
      if (!h) {
        const [tl, tr, br, bl] = corners;
        const topX = tl[0] * (1 - u) + tr[0] * u;
        const topY = tl[1] * (1 - u) + tr[1] * u;
        const botX = bl[0] * (1 - u) + br[0] * u;
        const botY = bl[1] * (1 - u) + br[1] * u;
        return [topX * (1 - v) + botX * v, topY * (1 - v) + botY * v];
      }
      const x = h[0] * u + h[1] * v + h[2];
      const y = h[3] * u + h[4] * v + h[5];
      const w = h[6] * u + h[7] * v + 1;
      return [x / w, y / w];
    }

    function cellQuad(row, col, rows, cols) {
      return [
        perspective(col / cols, row / rows),
        perspective((col + 1) / cols, row / rows),
        perspective((col + 1) / cols, (row + 1) / rows),
        perspective(col / cols, (row + 1) / rows),
      ];
    }

    function draw() {
      const rows = Number(rowsInput.value) || 1;
      const cols = Number(colsInput.value) || 1;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(photo, 0, 0);
      ctx.lineJoin = "round";
      let index = 1;
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const quad = cellQuad(row, col, rows, cols);
          stroke(quad, "rgba(0,0,0,0.85)", 5);
          stroke(quad, "#d6ff4a", 2);
          const left = Math.min(...quad.map((point) => point[0]));
          const top = Math.min(...quad.map((point) => point[1]));
          ctx.font = "600 22px Segoe UI, sans-serif";
          ctx.lineWidth = 4;
          ctx.strokeStyle = "rgba(0,0,0,0.8)";
          ctx.strokeText(String(index), left + 8, top + 26);
          ctx.fillStyle = "#d6ff4a";
          ctx.fillText(String(index), left + 8, top + 26);
          index += 1;
        }
      }
      const radius = screenPixels(16);
      edgePoints().forEach((point, index) => {
        const active = selected.kind === "edge" && selected.index === index;
        ctx.beginPath();
        ctx.arc(point[0], point[1], radius * 0.72, 0, Math.PI * 2);
        ctx.fillStyle = active ? "#ffffff" : "#8fd0ff";
        ctx.fill();
        ctx.lineWidth = screenPixels(2);
        ctx.strokeStyle = "#1b160f";
        ctx.stroke();
      });
      corners.forEach((point, index) => {
        const active = selected.kind === "corner" && selected.index === index;
        ctx.beginPath();
        ctx.arc(point[0], point[1], active ? radius * 1.25 : radius, 0, Math.PI * 2);
        ctx.fillStyle = active ? "#ffffff" : "#d6ff4a";
        ctx.fill();
        ctx.lineWidth = screenPixels(3);
        ctx.strokeStyle = "#1b160f";
        ctx.stroke();
      });
      const center = perspective(0.5, 0.5);
      ctx.beginPath();
      ctx.arc(center[0], center[1], radius * 0.85, 0, Math.PI * 2);
      ctx.fillStyle = selected.kind === "move" ? "#ffffff" : "#ffb020";
      ctx.fill();
      ctx.lineWidth = screenPixels(3);
      ctx.strokeStyle = "#1b160f";
      ctx.stroke();
    }

    function screenPixels(cssPixels) {
      const rect = canvas.getBoundingClientRect();
      return cssPixels * (canvas.width / Math.max(rect.width, 1));
    }

    function edgePoints() {
      return [
        midpoint(corners[0], corners[1]),
        midpoint(corners[1], corners[2]),
        midpoint(corners[2], corners[3]),
        midpoint(corners[3], corners[0]),
      ];
    }

    function midpoint(a, b) {
      return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    }

    function stroke(quad, color, width) {
      ctx.beginPath();
      ctx.moveTo(quad[0][0], quad[0][1]);
      for (let i = 1; i < quad.length; i++) ctx.lineTo(quad[i][0], quad[i][1]);
      ctx.closePath();
      ctx.lineWidth = width;
      ctx.strokeStyle = color;
      ctx.stroke();
    }

    function toImage(event) {
      const rect = canvas.getBoundingClientRect();
      const point = event.touches ? event.touches[0] : event;
      return [
        (point.clientX - rect.left) / rect.width * canvas.width,
        (point.clientY - rect.top) / rect.height * canvas.height,
      ];
    }

    function nearestHandle(point) {
      const limit = screenPixels(28);
      let best = null;
      let bestDist = limit;
      corners.forEach((corner, index) => {
        const dist = Math.hypot(corner[0] - point[0], corner[1] - point[1]);
        if (dist < bestDist) {
          best = { kind: "corner", index };
          bestDist = dist;
        }
      });
      edgePoints().forEach((edge, index) => {
        const dist = Math.hypot(edge[0] - point[0], edge[1] - point[1]);
        if (dist < bestDist) {
          best = { kind: "edge", index };
          bestDist = dist;
        }
      });
      const center = perspective(0.5, 0.5);
      if (Math.hypot(center[0] - point[0], center[1] - point[1]) < bestDist) {
        best = { kind: "move" };
      }
      return best;
    }

    function inside(point) {
      let hit = false;
      for (let i = 0, j = corners.length - 1; i < corners.length; j = i++) {
        const yi = corners[i][1];
        const yj = corners[j][1];
        const xi = corners[i][0];
        const xj = corners[j][0];
        const intersect = ((yi > point[1]) !== (yj > point[1]))
          && (point[0] < (xj - xi) * (point[1] - yi) / ((yj - yi) || 1e-6) + xi);
        if (intersect) hit = !hit;
      }
      return hit;
    }

    function describeSelection() {
      if (selected.kind === "corner") {
        return `The ${cornerNames[selected.index]} corner is selected. Drag it, or use the arrow keys, to resize. The other corners stay put.`;
      }
      if (selected.kind === "edge") {
        return `The ${edgeNames[selected.index]} edge is selected. Drag it to resize that side.`;
      }
      return "The middle handle moves the whole grid. Corners and edge handles resize it.";
    }

    function pointerDown(event) {
      const point = toImage(event);
      const handle = nearestHandle(point);
      if (!handle) return;
      selected = handle;
      drag = { ...handle, point };
      canvas.classList.add("dragging");
      status.textContent = describeSelection();
      event.preventDefault();
    }

    function pointerMove(event) {
      if (!drag) return;
      const point = toImage(event);
      const dx = point[0] - drag.point[0];
      const dy = point[1] - drag.point[1];
      if (drag.kind === "corner") {
        corners[drag.index] = point;
        homography = null;
      } else if (drag.kind === "edge") {
        const pair = [[0, 1], [1, 2], [2, 3], [3, 0]][drag.index];
        pair.forEach((index) => {
          corners[index] = [corners[index][0] + dx, corners[index][1] + dy];
        });
        drag.point = point;
        homography = null;
      } else {
        corners = corners.map(([x, y]) => [x + dx, y + dy]);
        drag.point = point;
        homography = null;
      }
      draw();
      event.preventDefault();
    }

    function pointerUp() {
      drag = null;
      canvas.classList.remove("dragging");
    }

    canvas.addEventListener("mousedown", pointerDown);
    window.addEventListener("mousemove", pointerMove);
    window.addEventListener("mouseup", pointerUp);
    canvas.addEventListener("touchstart", pointerDown, { passive: false });
    window.addEventListener("touchmove", pointerMove, { passive: false });
    window.addEventListener("touchend", pointerUp);

    window.addEventListener("keydown", (event) => {
      const step = (event.shiftKey ? 20 : 4) * screenPixels(1);
      const move = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[event.key];
      if (!move) return;
      homography = null;
      if (selected.kind === "corner") {
        const index = selected.index;
        corners[index] = [corners[index][0] + move[0], corners[index][1] + move[1]];
      } else if (selected.kind === "edge") {
        const pair = [[0, 1], [1, 2], [2, 3], [3, 0]][selected.index];
        pair.forEach((index) => {
          corners[index] = [corners[index][0] + move[0], corners[index][1] + move[1]];
        });
      } else {
        corners = corners.map(([x, y]) => [x + move[0], y + move[1]]);
      }
      draw();
      event.preventDefault();
    });

    rowsInput.addEventListener("input", draw);
    colsInput.addEventListener("input", draw);
    insetInput.addEventListener("input", () => {
      insetValue.textContent = insetInput.value;
    });

    document.getElementById("reset").addEventListener("click", () => {
      const m = 0.12;
      corners = [
        [canvas.width * m, canvas.height * m],
        [canvas.width * (1 - m), canvas.height * m],
        [canvas.width * (1 - m), canvas.height * (1 - m)],
        [canvas.width * m, canvas.height * (1 - m)],
      ];
      homography = null;
      draw();
      status.textContent = "Fresh box. Drag the corners onto the outside of the stack.";
    });

    document.getElementById("save").addEventListener("click", async () => {
      status.textContent = "Saving crops…";
      const response = await fetch("/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          rows: Number(rowsInput.value),
          cols: Number(colsInput.value),
          inset: Number(insetInput.value),
          corners,
        }),
      });
      const body = await response.json();
      if (!response.ok) {
        status.textContent = body.error || "Save failed.";
        return;
      }
      status.textContent = `Saved ${body.cases} crops. Next: python -m cdindex search --out ${body.out}`;
    });

    function fit() {
      const aside = document.querySelector("aside").getBoundingClientRect();
      const maxW = Math.max(240, window.innerWidth - aside.width - 28);
      const maxH = Math.max(240, window.innerHeight - 28);
      const fitted = Math.min(maxW / canvas.width, maxH / canvas.height);
      const scale = fitted * (Number(zoomInput.value) / 100);
      canvas.style.width = `${canvas.width * scale}px`;
      canvas.style.height = `${canvas.height * scale}px`;
      zoomValue.textContent = zoomInput.value === "100" ? "Fit" : `${zoomInput.value}%`;
    }

    function reveal(point) {
      const canvasRect = canvas.getBoundingClientRect();
      const mainRect = main.getBoundingClientRect();
      const scaleX = canvasRect.width / canvas.width;
      const scaleY = canvasRect.height / canvas.height;
      const x = canvasRect.left - mainRect.left + main.scrollLeft + point[0] * scaleX;
      const y = canvasRect.top - mainRect.top + main.scrollTop + point[1] * scaleY;
      main.scrollLeft = x - main.clientWidth / 2;
      main.scrollTop = y - main.clientHeight / 2;
    }

    zoomInput.addEventListener("input", fit);
    document.getElementById("focus-br").addEventListener("click", () => {
      selected = { kind: "corner", index: 2 };
      zoomInput.value = "250";
      fit();
      requestAnimationFrame(() => reveal(corners[2]));
      status.textContent = describeSelection();
      draw();
    });

    photo.onload = async () => {
      canvas.width = photo.naturalWidth;
      canvas.height = photo.naturalHeight;
      const state = await (await fetch("/state")).json();
      rowsInput.value = state.rows;
      colsInput.value = state.cols;
      insetInput.value = state.inset;
      insetValue.textContent = state.inset;
      corners = state.corners;
      homography = null;
      fit();
      requestAnimationFrame(() => draw());
    };
    window.addEventListener("resize", () => { if (canvas.width) fit(); });
    photo.src = "/photo";
  </script>
</body>
</html>
